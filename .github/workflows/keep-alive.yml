# TEMPORARY workaround for Render free-tier cold starts.
# Pings the service every 10 minutes so it does not spin down.
# DELETE THIS FILE once the paid plan upgrade is live.

name: Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # /health returns 200 {"ok":true}; the site root returns 404, so do not
      # point this at "/" -- curl -f would treat that as a failure every run.
      PING_URL: "https://menler-new-web-w3pz.onrender.com/health"
    steps:
      - name: Ping service
        run: |
          if curl -sf --max-time 30 "$PING_URL" -o /dev/null; then
            echo "Ping OK"
            exit 0
          fi
          echo "First ping failed, retrying in 10s..."
          sleep 10
          if curl -sf --max-time 30 "$PING_URL" -o /dev/null; then
            echo "Ping OK on retry"
            exit 0
          fi
          echo "Ping failed twice - service may be down"
          exit 1
